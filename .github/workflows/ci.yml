name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-guards:
    name: Lint & Architectural Guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.64.8

      - name: Verify Formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l modules/ tests/)
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ Unformatted Go files detected:"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "✅ All Go source files are formatted correctly."

      - name: Check Domain Purity Guards (Fitness Functions)
        run: |
          make domain_guard

      - name: Run golangci-lint on Modules
        run: |
          make domain_lint
          make protocol_lint
          make rules_lint
          make telemetry_lint
          make agent_lint
          make server_lint
          make streamer_lint

  unit-tests:
    name: Unit & Module Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run Domain Tests (with Race Detector)
        run: |
          cd modules/libs/domain && go test -v -race -coverprofile=coverage-domain.out ./...

      - name: Run Rules Tests
        run: |
          cd modules/libs/rules && go test -v -race -coverprofile=coverage-rules.out ./...

      - name: Run Telemetry Tests
        run: |
          cd modules/libs/telemetry && go test -v -race -coverprofile=coverage-telemetry.out ./...

      - name: Run Agent Tests
        run: |
          cd modules/apps/agent && go test -v -race -coverprofile=coverage-agent.out ./...

      - name: Run Server Tests
        run: |
          cd modules/apps/server && go test -v -race -coverprofile=coverage-server.out ./...

      - name: Run Streamer Tests
        run: |
          cd modules/apps/streamer && go test -v -race -coverprofile=coverage-streamer.out ./...

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-reports
          path: modules/**/coverage-*.out
          retention-days: 7

  e2e-tests:
    name: End-to-End System Tests
    runs-on: ubuntu-latest
    needs: [lint-and-guards, unit-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run Full E2E Integration Pipeline
        run: |
          make e2e_test

  build-and-package:
    name: Build Binaries & Container Images
    runs-on: ubuntu-latest
    needs: [lint-and-guards, unit-tests, e2e-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Static Production Binaries
        run: |
          make build

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auditflow-binaries-linux-amd64
          path: |
            bin/server
            bin/agent
            bin/streamer
          retention-days: 14

      - name: Build Server Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: modules/apps/server/Dockerfile
          push: false
          tags: auditflow-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Agent Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: modules/apps/agent/Dockerfile
          push: false
          tags: auditflow-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Streamer Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: modules/apps/streamer/Dockerfile
          push: false
          tags: auditflow-streamer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
