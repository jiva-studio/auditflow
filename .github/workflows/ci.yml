name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. ARCHITECTURAL GUARDS & FORMATTING
  # ----------------------------------------------------------------------------
  fitness-guards:
    name: Architecture Guards & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Verify Code Formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l modules/ tests/)
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ Unformatted Go files:"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "✅ Formatting check passed."

      - name: Verify Domain Purity (AST Guards)
        run: |
          python3 scripts/guards/domain/no_json.py
          python3 scripts/guards/domain/no_io.py

  # ----------------------------------------------------------------------------
  # 2. STATIC ANALYSIS & LINTERS
  # ----------------------------------------------------------------------------
  lint:
    name: Code Quality (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin

      - name: Lint Domain Library
        run: cd modules/libs/domain && golangci-lint run ./...

      - name: Lint Protocol Library
        run: cd modules/libs/protocol && golangci-lint run ./...

      - name: Lint Rules Library
        run: cd modules/libs/rules && golangci-lint run ./...

      - name: Lint Telemetry Library
        run: cd modules/libs/telemetry && golangci-lint run ./...

      - name: Lint Agent Service
        run: cd modules/apps/agent && golangci-lint run ./...

      - name: Lint Server Service
        run: cd modules/apps/server && golangci-lint run ./...

      - name: Lint Streamer Service
        run: cd modules/apps/streamer && golangci-lint run ./...

  # ----------------------------------------------------------------------------
  # 3. UNIT & INTEGRATION TESTS
  # ----------------------------------------------------------------------------
  unit-tests:
    name: Unit & Module Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Test Domain Library
        run: cd modules/libs/domain && go test -v -race -coverprofile=coverage-domain.out ./...

      - name: Test Rules Library
        run: cd modules/libs/rules && go test -v -race -coverprofile=coverage-rules.out ./...

      - name: Test Telemetry Library
        run: cd modules/libs/telemetry && go test -v -race -coverprofile=coverage-telemetry.out ./...

      - name: Test Agent Service
        run: cd modules/apps/agent && go test -v -race -coverprofile=coverage-agent.out ./...

      - name: Test Server Service
        run: cd modules/apps/server && go test -v -race -coverprofile=coverage-server.out ./...

      - name: Test Streamer Service
        run: cd modules/apps/streamer && go test -v -race -coverprofile=coverage-streamer.out ./...

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-reports
          path: modules/**/coverage-*.out
          retention-days: 7

  # ----------------------------------------------------------------------------
  # 4. END-TO-END PIPELINE TESTS
  # ----------------------------------------------------------------------------
  e2e-tests:
    name: E2E Integration Pipeline
    runs-on: ubuntu-latest
    needs: [fitness-guards, unit-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run Full E2E Test Suite
        run: make e2e_test

  # ----------------------------------------------------------------------------
  # 5. BINARY COMPILATION & PACKAGING
  # ----------------------------------------------------------------------------
  build-binaries:
    name: Build Static Binaries
    runs-on: ubuntu-latest
    needs: [fitness-guards, lint, unit-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Static Production Binaries
        run: make build

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auditflow-binaries-linux-amd64
          path: |
            bin/server
            bin/agent
            bin/streamer
          retention-days: 14

  # ----------------------------------------------------------------------------
  # 6. CONTAINER BUILDS
  # ----------------------------------------------------------------------------
  build-containers:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [fitness-guards, lint, unit-tests, e2e-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: modules/apps/server/Dockerfile
          push: false
          tags: auditflow-server:latest

      - name: Build Agent Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: modules/apps/agent/Dockerfile
          push: false
          tags: auditflow-agent:latest

      - name: Build Streamer Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: modules/apps/streamer/Dockerfile
          push: false
          tags: auditflow-streamer:latest
