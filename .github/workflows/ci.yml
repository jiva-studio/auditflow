name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. ARCHITECTURE FITNESS FUNCTIONS & FORMATTING
  # ----------------------------------------------------------------------------
  architecture-guards:
    name: Architecture Guards & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Verify Code Formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l modules/ tests/)
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ Unformatted Go files:"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "✅ Formatting check passed."

      - name: Verify Domain Purity (AST Guards)
        run: |
          python3 scripts/guards/domain/no_json.py
          python3 scripts/guards/domain/no_io.py

  # ----------------------------------------------------------------------------
  # 2. PARALLEL UNIT TESTS MATRIX
  # ----------------------------------------------------------------------------
  unit-test:
    name: Unit Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: libs/domain
            path: modules/libs/domain
            id: libs-domain
          - name: libs/rules
            path: modules/libs/rules
            id: libs-rules
          - name: libs/telemetry
            path: modules/libs/telemetry
            id: libs-telemetry
          - name: apps/agent
            path: modules/apps/agent
            id: apps-agent
          - name: apps/server
            path: modules/apps/server
            id: apps-server
          - name: apps/streamer
            path: modules/apps/streamer
            id: apps-streamer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run Tests with Race Detector
        run: |
          cd ${{ matrix.path }} && go test -v -race -coverprofile=coverage.out ./...

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.id }}
          path: ${{ matrix.path }}/coverage.out
          retention-days: 7

  # ----------------------------------------------------------------------------
  # 3. PARALLEL LINTER MATRIX
  # ----------------------------------------------------------------------------
  lint:
    name: Lint (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: libs/domain
            path: modules/libs/domain
          - name: libs/protocol
            path: modules/libs/protocol
          - name: libs/rules
            path: modules/libs/rules
          - name: libs/telemetry
            path: modules/libs/telemetry
          - name: apps/agent
            path: modules/apps/agent
          - name: apps/server
            path: modules/apps/server
          - name: apps/streamer
            path: modules/apps/streamer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.5

      - name: Run golangci-lint
        run: |
          ROOT_DIR=$(pwd)
          cd ${{ matrix.path }} && golangci-lint run --config "$ROOT_DIR/.golangci.yml" ./...

  # ----------------------------------------------------------------------------
  # 4. PARALLEL E2E TESTS MATRIX
  # ----------------------------------------------------------------------------
  e2e-test:
    name: E2E Test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: [architecture-guards, unit-test]
    strategy:
      fail-fast: false
      matrix:
        suite: [streamer, agent, server]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run E2E Test Suite
        run: |
          make ${{ matrix.suite }}_e2e_test

  # ----------------------------------------------------------------------------
  # 5. BINARY COMPILATION & PACKAGING
  # ----------------------------------------------------------------------------
  build-binaries:
    name: Build Static Binaries
    runs-on: ubuntu-latest
    needs: [architecture-guards, lint, unit-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Static Production Binaries
        run: make build

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auditflow-binaries-linux-amd64
          path: |
            bin/server
            bin/agent
            bin/streamer
          retention-days: 14

  # ----------------------------------------------------------------------------
  # 6. PARALLEL CONTAINER BUILDS MATRIX
  # ----------------------------------------------------------------------------
  build-docker:
    name: Docker Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [architecture-guards, lint, unit-test, e2e-test]
    strategy:
      matrix:
        service: [server, agent, streamer]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: modules/apps/${{ matrix.service }}/Dockerfile
          push: false
          tags: auditflow-${{ matrix.service }}:latest
