syntax = "proto3";

package assessment.protocol.v1;

option go_package = "assessment/libs/protocol/gen/go/v1;v1";

import "google/protobuf/timestamp.proto";

message Popup {
  string employee = 1;
  string rule = 2;
  google.protobuf.Timestamp ts = 3;
  string title = 4;
  string body = 5;
}

message AuditQuery {
  string employee = 1;
  string rule = 2;
}

message AuditResponse {
  repeated Popup popups = 1;
}
