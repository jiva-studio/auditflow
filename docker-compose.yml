# ==============================================================================
# AUDITFLOW - DOCKER COMPOSE ORCHESTRATION
# ==============================================================================

services:
  server:
    build:
      context: .
      dockerfile: modules/apps/server/Dockerfile
    container_name: server
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 1s
      timeout: 2s
      retries: 15
      start_period: 1s

  runner:
    build:
      context: .
      dockerfile: modules/apps/runner/Dockerfile
    container_name: runner
    environment:
      SERVER_URL: "http://server:8080"
      RULES_PATH: "/rules.json"
      DATA_DIR: "/data"
      TICK_MS: "${TICK_MS:-10}"
      CONCURRENCY: "${CONCURRENCY:-10}"
    volumes:
      - ./data:/data:ro
      - ./rules.json:/rules.json:ro
    depends_on:
      server:
        condition: service_healthy
